# Automatic Playwright (+ bundled Chromium) updates.
# Once a month, Dependabot opens a PR bumping @playwright/test to the newest
# version that has been out for at least 14 days. CI then runs every test
# against the new Chromium on that PR - merge it when the checks are green.
# Manual equivalent: npm run update:playwright
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    allow:
      - dependency-name: "@playwright/test"
    cooldown:
      default-days: 14
    open-pull-requests-limit: 1
    commit-message:
      prefix: "deps"
