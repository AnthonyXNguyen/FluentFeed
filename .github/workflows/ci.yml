name: CI

on:
  pull_request:
  push:
    branches: [main]

# Runners are pinned (not ubuntu-latest) so a GitHub image upgrade can't
# break CI by surprise - older Playwright versions can't install Chromium
# on newer Ubuntu releases. Bump deliberately, checking Playwright support.

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (Expo)
    runs-on: ubuntu-24.04
    env:
      # Placeholders so the web bundle can be built; nothing talks to these in CI.
      EXPO_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: placeholder
      EXPO_PUBLIC_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build web bundle
        run: npx expo export --platform web

  e2e:
    name: E2E (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # WebKit hasn't had a verified CI run yet, so it reports but doesn't
    # fail the workflow. Remove this once it's green.
    continue-on-error: ${{ matrix.browser == 'webkit' }}
    strategy:
      fail-fast: false # one browser failing shouldn't cancel the others
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v5 # get code
      - uses: actions/setup-node@v5 # install javscript language
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install ${{ matrix.browser }}
        run: npx playwright install --with-deps ${{ matrix.browser }}
      # Starts its own Expo web server with fake Supabase/API hosts
      # (playwright.config.ts), so no secrets are needed.
      - name: Run end-to-end tests
        run: npm run e2e -- --project=${{ matrix.browser }}
      - name: Upload report (screenshots + traces)
        if: failure()
        uses: actions/upload-artifact@v6 # save files 
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  backend:
    name: Backend (FastAPI)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
